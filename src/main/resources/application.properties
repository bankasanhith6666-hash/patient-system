server.port=${PORT:8080}

# ==============================================================================
# Database Configuration (Default: H2 In-Memory for Local Testing)
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:patientdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# PostgreSQL Configuration (Uncomment to use PostgreSQL)
# spring.datasource.url=jdbc:postgresql://localhost:5432/patient_system_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
# JPA & Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging.level.org.springframework=INFO
logging.level.com.example.patient_system=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==============================================================================
# Thymeleaf Configuration
# ==============================================================================
spring.thymeleaf.cache=false

# ==============================================================================
# Custom Hospital Header Configuration
# ==============================================================================
hospital.security.header.name=X-Hospital-Code
hospital.security.header.expected-code=HOSP-NYC-001

# ==============================================================================
# Spring Boot Actuator - application health and appointment metrics
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.metrics.tags.application=patient-system
